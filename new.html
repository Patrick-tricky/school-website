<style>
    
.hero {
    position: relative;
    width: 100%;
    height: 100vh;

    overflow: hidden;
}



.slides {
    position: absolute;
    inset: 0;
}


.slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
    transform: scale(1);
}


/* Current image */

.slide.active {
    opacity: 1;

    animation: zoomImage 6s ease-in-out;
}


/* =========================
   SLOW ZOOM EFFECT
========================= */

@keyframes zoomImage {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.08);
    }

}


/* =========================
   DARK OVERLAY
========================= */

.overlay {
    position: absolute;
    inset: 0;

    background: rgba(0, 0, 0, 0.48);

    z-index: 2;
}


/* =========================
   HERO CONTENT
========================= */

.hero-content {
    position: relative;

    z-index: 3;

    height: 100%;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    color: white;

    padding: 20px;
}


/* Small heading */

.hero-content h3 {
    color: #ff003c;

    font-size: 30px;

    margin-bottom: 50px;

    font-weight: 700;
}


/* Main heading */

.hero-content h1 {
    font-size: clamp(55px, 8vw, 120px);

    line-height: 1.05;

    font-weight: 900;

    margin-bottom: 60px;
}


/* Description */

.hero-content p {
    max-width: 1200px;

    font-size: 30px;

    line-height: 1.7;

    margin-bottom: 50px;
}


/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;
    gap: 30px;
}


.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 430px;
    height: 95px;
    text-decoration: none;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 3px;
    transition: 0.3s;
}


/* First button */

.outline {
    color: white;

    border: 4px solid white;

    background: rgba(255,255,255,0.08);
}


/* Second button */

.filled {
    background: white;

    color: #21113c;
}


/* Hover */

.outline:hover {
    background: white;
    color: #21113c;
}

.filled:hover {
    background: #ff003c;
    color: white;
}


/* =========================
   SLIDE DOTS
========================= */

.dots {
    position: absolute;

    z-index: 5;

    bottom: 40px;

    left: 50%;

    transform: translateX(-50%);

    display: flex;

    gap: 25px;
}


.dot {
    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: #888;

    cursor: pointer;

    transition: 0.4s;
}


.dot.active {
    width: 65px;

    border-radius: 20px;

    background: #ff003c;
}
</style>

<section class="hero">

    <!-- Background slides -->
    <div class="slides">

        <div class="slide active"
             style="background-image: url('new/images/school1.jpg');">
        </div>

        <div class="slide"
             style="background-image: url('new/images/school2.jpg');">
        </div>

        <div class="slide"
             style="background-image: url('new/images/school3.jpg');">
        </div>

        <div class="slide"
             style="background-image: url('images/school4.jpg');">
        </div>

    </div>


    <!-- Dark overlay -->
    <div class="overlay"></div>


    <!-- Content -->
    <div class="hero-content">

        <h3>WELCOME TO EXCELLENCE</h3>

        <h1>
            ELITE HIGH SCHOOL<br>
            ENTEBBE
        </h1>

        <p>
            A distinguished institution committed to academic brilliance,
            character development and holistic growth in Entebbe.
        </p>

        <div class="buttons">

            <a href="#" class="btn outline">
                APPLY FOR O'LEVEL
            </a>

            <a href="#" class="btn filled">
                APPLY FOR A'LEVEL
            </a>

        </div>

    </div>


    <!-- Slide indicators -->
    <div class="dots">

        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

    </div>

</section>

<script>
const slides = document.querySelectorAll(".slide");
const dots = document.querySelectorAll(".dot");

let currentSlide = 0;


/* Change slide */

function showSlide(index) {

    slides.forEach(slide => {
        slide.classList.remove("active");
    });

    dots.forEach(dot => {
        dot.classList.remove("active");
    });


    slides[index].classList.add("active");
    dots[index].classList.add("active");

    currentSlide = index;
}


/* Automatic slideshow */

function nextSlide() {

    let next = currentSlide + 1;

    if (next >= slides.length) {
        next = 0;
    }

    showSlide(next);
}


/* Change every 6 seconds */

setInterval(nextSlide, 6000);


/* Allow clicking the dots */

dots.forEach((dot, index) => {

    dot.addEventListener("click", () => {

        showSlide(index);

    });

});
</script>
